name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install
      run: npm install

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Unit tests
      run: npm test

    - name: Shell syntax
      run: bash -n bin/run.sh && bash -n bin/host-lib.sh

    - name: Host checks
      run: bash test/host.test.sh
