name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Install
      run: npm install

    - name: Workflow lint
      run: |
        curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
        ./actionlint .github/workflows/*.yml

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Unit tests
      run: npm test

    - name: Shell syntax
      run: for f in bin/*.sh bin/perf-hold; do bash -n "$f" || exit 1; done

    - name: Host checks
      run: bash test/host.test.sh
